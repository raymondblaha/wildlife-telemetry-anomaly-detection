[project]
name = "wildlife-telemetry-anomaly-detection"
version = "0.1.0"
description = "Public-safe telemetry anomaly detection scaffold for cervid CWD movement studies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "pyyaml",
]

[project.optional-dependencies]
deep-learning = ["tensorflow"]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
